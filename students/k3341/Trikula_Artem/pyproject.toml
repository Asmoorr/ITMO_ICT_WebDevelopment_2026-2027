[project]
name = "web-development-laboratories"
version = "0.1.0"
description = "Лабораторные работы по веб-программированию"
authors = [{ name = "Artem Trikula" }]
requires-python = ">=3.12,<4.0"
dependencies = ["django (==6.1.2)", "psycopg[binary] (>=3.2,<4)", "python-dotenv (>=1.1,<2)", "jinja2 (>=3.1.6,<4)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)"
]
